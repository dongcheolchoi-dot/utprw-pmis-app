<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Install U-Tapao PMIS Mobile</title>
<link rel="icon" type="image/png" href="./assets/icon-192.png">
<!-- 설치 안내 페이지 (2026-11-21): 매뉴얼 QR 코드가 가리키는 고정 주소.
     Android = 서버 getAppUpdate(로그인 불필요)가 알려 주는 최신 APK 로 연결 / iPhone = Safari 홈 화면 추가 안내.
     원본: utapao-pmis 저장소 mobile_app/pages/install.html → mobile_app/tools/publish_pages.js 로 GitHub Pages 에 게시 -->
<style>
  :root { --navy: #0f172a; --primary: #2563eb; --green: #16a34a; --amber: #f59e0b; --text: #0f172a; --muted: #64748b; --border: #cbd5e1; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Segoe UI', 'Leelawadee UI', Tahoma, 'Malgun Gothic', sans-serif; background: #f1f5f9; color: var(--text); }
  header { background: var(--navy); color: #fff; padding: 18px 16px 16px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top img { width: 52px; height: 52px; border-radius: 12px; }
  h1 { font-size: 19px; margin: 0; }
  .sub { font-size: 13px; color: #cbd5e1; margin-top: 2px; }
  .langs { margin-top: 12px; display: flex; gap: 6px; }
  .langs button { border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .langs button.on { background: var(--amber); border-color: var(--amber); color: var(--navy); }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin: 14px 0; box-shadow: 0 1px 3px rgba(15,23,42,.06); }
  .card h2 { font-size: 17px; margin: 0 0 10px; }
  .card.mine { border: 2px solid var(--primary); }
  .btn { display: block; width: 100%; text-align: center; text-decoration: none; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 800; color: #fff; background: var(--green); margin: 10px 0 4px; }
  .btn.blue { background: var(--primary); }
  .btn.off { background: #94a3b8; pointer-events: none; }
  ol { padding-left: 22px; margin: 8px 0 0; line-height: 1.6; font-size: 15px; }
  .muted { color: var(--muted); font-size: 13px; }
  .warn { background: #fef3c7; border: 1px solid #fcd34d; color: #78350f; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 10px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 800; background: #dbeafe; color: #1e40af; border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: middle; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 16px 28px; }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><img src="./assets/icon-192.png" alt=""><div><h1 data-t="title"></h1><div class="sub" data-t="sub"></div></div></div>
  <div class="langs"><button data-l="en">EN</button><button data-l="th">TH</button><button data-l="ko">KO</button></div>
</div></header>
<main class="wrap">
  <section class="card" id="cardAndroid">
    <h2>🤖 Android <span class="badge" id="apkVer"></span></h2>
    <a class="btn off" id="apkBtn" href="#" data-t="apk_loading"></a>
    <div class="muted" id="apkNote"></div>
    <ol><li data-t="a1"></li><li data-t="a2"></li><li data-t="a3"></li><li data-t="a4"></li></ol>
  </section>
  <section class="card" id="cardIos">
    <h2>🍎 iPhone / iPad</h2>
    <div class="warn" id="notSafari" hidden data-t="not_safari"></div>
    <ol><li data-t="i1"></li><li data-t="i2"></li><li data-t="i3"></li><li data-t="i4"></li></ol>
    <a class="btn blue" href="./" data-t="open_app"></a>
  </section>
  <section class="card">
    <h2>📖 <span data-t="guide"></span></h2>
    <a class="btn blue" href="./manual/en.html">User Guide (English)</a>
    <a class="btn blue" href="./manual/th.html">คู่มือการใช้งาน (ภาษาไทย)</a>
  </section>
  <section class="card">
    <div class="muted" data-t="account"></div>
  </section>
</main>
<footer>U-Tapao International Airport Expansion — Construction Supervision (CSC)</footer>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbxGK9FsMM-Lq3-pBFQAmjmYzoQURa9MR9hfklozXayVDDsvkzh0oXe35wPzkzR5tfQS/exec';
  var D = {
    en: { title: 'U-Tapao PMIS Mobile', sub: 'Install the field app', apk_loading: 'Checking the latest app…', apk_btn: 'Download Android app', apk_fail: 'Could not get the download. Check your internet and reload this page.',
      a1: 'Tap Download Android app. The file name ends in .apk.', a2: 'Open the downloaded file. If Android asks, allow this browser to install unknown apps, then go back.', a3: 'Tap Install, then Open.', a4: 'Log in with your PMIS user ID and password. Allow camera, location and notifications when asked.',
      not_safari: 'Open this page in Safari. Other browsers on iPhone cannot add the app to the Home Screen.',
      i1: 'Open this page in Safari.', i2: 'Tap Open the app below.', i3: 'Tap the Share button (square with an up arrow), then Add to Home Screen, then Add.', i4: 'Start the app from the new U-Tapao PMIS icon on your Home Screen and log in.',
      open_app: 'Open the app', guide: 'User guide', account: 'You need a PMIS user ID and password. Ask the PMIS administrator if you do not have one.' },
    th: { title: 'U-Tapao PMIS Mobile', sub: 'ติดตั้งแอปหน้างาน', apk_loading: 'กำลังตรวจสอบแอปล่าสุด…', apk_btn: 'ดาวน์โหลดแอป Android', apk_fail: 'ดาวน์โหลดไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วโหลดหน้านี้ใหม่',
      a1: 'แตะ ดาวน์โหลดแอป Android ไฟล์จะลงท้ายด้วย .apk', a2: 'เปิดไฟล์ที่ดาวน์โหลด หาก Android ถาม ให้อนุญาตให้เบราว์เซอร์นี้ติดตั้งแอปที่ไม่รู้จัก แล้วกดย้อนกลับ', a3: 'แตะ ติดตั้ง แล้วแตะ เปิด', a4: 'เข้าสู่ระบบด้วยรหัสผู้ใช้และรหัสผ่าน PMIS และอนุญาตกล้อง ตำแหน่ง และการแจ้งเตือนเมื่อระบบถาม',
      not_safari: 'กรุณาเปิดหน้านี้ใน Safari เบราว์เซอร์อื่นบน iPhone ไม่สามารถเพิ่มแอปไว้ที่หน้าจอโฮมได้',
      i1: 'เปิดหน้านี้ใน Safari', i2: 'แตะ เปิดแอป ด้านล่าง', i3: 'แตะปุ่มแชร์ (สี่เหลี่ยมมีลูกศรชี้ขึ้น) แล้วแตะ เพิ่มไปยังหน้าจอโฮม แล้วแตะ เพิ่ม', i4: 'เปิดแอปจากไอคอน U-Tapao PMIS ที่หน้าจอโฮม แล้วเข้าสู่ระบบ',
      open_app: 'เปิดแอป', guide: 'คู่มือการใช้งาน', account: 'ต้องมีรหัสผู้ใช้และรหัสผ่าน PMIS หากยังไม่มี ให้ติดต่อผู้ดูแลระบบ PMIS' },
    ko: { title: 'U-Tapao PMIS 모바일', sub: '현장 앱 설치', apk_loading: '최신 앱 확인 중…', apk_btn: 'Android 앱 내려받기', apk_fail: '내려받기 주소를 가져오지 못했습니다. 인터넷 연결을 확인하고 이 페이지를 새로 고치세요.',
      a1: 'Android 앱 내려받기를 누릅니다. 파일 이름은 .apk 로 끝납니다.', a2: '내려받은 파일을 엽니다. Android 가 물으면 이 브라우저의 알 수 없는 앱 설치를 허용하고 뒤로 갑니다.', a3: '설치 → 열기를 누릅니다.', a4: 'PMIS 아이디와 비밀번호로 로그인하고, 카메라·위치·알림 권한을 허용합니다.',
      not_safari: '이 페이지를 Safari 로 여세요. iPhone 의 다른 브라우저로는 홈 화면에 앱을 추가할 수 없습니다.',
      i1: '이 페이지를 Safari 로 엽니다.', i2: '아래 앱 열기를 누릅니다.', i3: '공유 버튼(네모에 위쪽 화살표) → 홈 화면에 추가 → 추가를 누릅니다.', i4: '홈 화면에 생긴 U-Tapao PMIS 아이콘으로 앱을 열고 로그인합니다.',
      open_app: '앱 열기', guide: '사용 설명서', account: 'PMIS 아이디와 비밀번호가 필요합니다. 없으면 PMIS 관리자에게 요청하세요.' }
  };
  var ua = navigator.userAgent || '';
  var isIos = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var isSafari = isIos && !/CriOS|FxiOS|EdgiOS|OPiOS|Line\//i.test(ua);
  var lang = (navigator.language || 'en').slice(0, 2);
  try { lang = localStorage.getItem('pmis_install_lang') || lang; } catch (e) {}
  if (!D[lang]) lang = 'en';
  var apk = null, apkFailed = false;

  function render() {
    var t = D[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function (el) { var k = el.getAttribute('data-t'); if (t[k]) el.textContent = t[k]; });
    document.querySelectorAll('[data-l]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-l') === lang); });
    var btn = document.getElementById('apkBtn');
    if (apk) { btn.textContent = t.apk_btn; btn.href = apk.url; btn.classList.remove('off'); document.getElementById('apkVer').textContent = 'v' + apk.versionName; }
    document.getElementById('apkNote').textContent = apkFailed ? t.apk_fail : '';
    document.getElementById('notSafari').hidden = !(isIos && !isSafari);
  }
  // 내 휴대폰 종류를 위에, 강조 표시
  var main = document.querySelector('main');
  if (isIos) { main.insertBefore(document.getElementById('cardIos'), main.firstChild); document.getElementById('cardIos').classList.add('mine'); }
  else if (isAndroid) document.getElementById('cardAndroid').classList.add('mine');
  document.querySelectorAll('[data-l]').forEach(function (b) {
    b.addEventListener('click', function () { lang = b.getAttribute('data-l'); try { localStorage.setItem('pmis_install_lang', lang); } catch (e) {} render(); });
  });
  render();
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ source: 'PMIS_MOBILE_APP', action: 'getAppUpdate', payload: { from: 'install-page' } }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.apk && j.apk.url) apk = j.apk; else apkFailed = true; render(); })
    .catch(function () { apkFailed = true; render(); });
})();
</script>
</body>
</html>
